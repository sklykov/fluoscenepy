name: Run Python tests

on:
  push:
    branches: [ main ]  # - add for limiting it only to pushes on a main branch
    paths:  # specify which changes guide to triggering the tests
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/test.yaml'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - name: Checkout code  # loads code from a repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      # Exercise the base installation without Numba on the minimum supported Python version
      - name: Install optional acceleration
        if: matrix.python-version != '3.10'
        run: python -m pip install -e ".[performance]"

      - name: Run tests
        run: python -m pytest
